<div class="sidebar__header">
  <a routerLink="/dashboard" class="sidebar__logo">ניהול <strong>בית ספר</strong></a>
  <button type="button" class="sidebar__close" (click)="closed.emit()" aria-label="סגירת התפריט">
    <span class="icon" aria-hidden="true">close</span>
  </button>
</div>

<nav class="sidebar__nav" aria-label="ניווט ראשי">
  <ul>
    @for (item of navItems; track item.path) {
      <li>
        <a
          [routerLink]="item.path"
          routerLinkActive="is-active"
          ariaCurrentWhenActive="page"
          class="sidebar__link"
          (click)="closed.emit()"
        >
          <span class="icon" aria-hidden="true">{{ item.icon }}</span>
          <span>{{ item.label }}</span>
        </a>
      </li>
    }
  </ul>
</nav>
