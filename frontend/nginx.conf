# Serves the built Angular app and forwards API calls to the API container, so the browser talks to
# one origin (no CORS needed) – the same setup as proxy.conf.json in development.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Uploads: the API allows 5 MB files (plus a little for the multipart envelope).
  client_max_body_size 6m;

  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /swagger/ {
    proxy_pass http://api:8080;
  }

  # Hashed bundle files never change, so the browser may cache them for a long time.
  location ~* \.(?:js|css|woff2?|png|jpg|svg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Any other path is an Angular route: return index.html and let the router handle it.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
