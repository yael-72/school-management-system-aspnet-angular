name: Deploy

# Deploys the live demo to Azure App Service after every push to main (or by hand from the
# Actions tab). The Angular build is copied into the API's wwwroot, so one App Service serves
# both the site and the API. Setup: docs/deployment.md. Until the repository variable
# AZURE_WEBAPP_NAME exists, the job is skipped (the repository works without Azure).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deployments at the same time; a newer one waits for the running one.
concurrency:
  group: deploy-azure
  cancel-in-progress: false

jobs:
  deploy:
    name: Test, build and deploy
    if: vars.AZURE_WEBAPP_NAME != ''
    runs-on: ubuntu-latest
    environment:
      name: live-demo
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # A broken build never reaches the live site.
      - name: Test the API
        run: dotnet test backend -c Release

      - name: Build the Angular app
        working-directory: frontend
        run: |
          npm ci
          npx ng build --configuration production

      - name: Publish the API with the Angular app in wwwroot
        run: |
          dotnet publish backend/src/SchoolManagement.Api -c Release -o publish
          cp -r frontend/dist/frontend/browser publish/wwwroot

      - name: Deploy to Azure App Service
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish
